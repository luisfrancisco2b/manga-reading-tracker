{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Redefinir Senha</h2>
    <p style="margin-bottom: 20px; text-align: center; color: var(--text-color);">Redefinindo senha para: <strong>{{ email }}</strong></p>
    <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
        <input type="hidden" name="email" value="{{ email }}">
        
        <div class="form-group">
            <label for="new_password">Nova Senha:</label>
            <div class="password-wrapper">
                <input type="password" id="new_password" name="new_password" required>
                <button type="button" class="password-toggle" onclick="togglePassword(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirmar Nova Senha:</label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" required>
                <button type="button" class="password-toggle" onclick="togglePassword(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>
        
        <button type="submit" class="btn">Alterar Senha</button>
    </form>
    <p style="margin-top: 15px;"><a href="{{ url_for('login') }}">Cancelar</a></p>
</div>
{% endblock %}
