{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Esqueci minha senha</h2>
    <p style="margin-bottom: 20px; text-align: center; color: var(--text-color);">Informe o email cadastrado para redefinir sua senha.</p>
    <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn">Continuar</button>
    </form>
    <p style="margin-top: 15px;"><a href="{{ url_for('login') }}">Voltar para o Login</a></p>
</div>
{% endblock %}
